name: Deploy Space Defender 1984 to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Code to App Directory (/var/www/app)
        run: |
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.next' ./ /var/www/app/

      - name: Build & Restart Application
        run: |
          cd /var/www/app
          npm install
          npm run build
          pm2 restart ecosystem.config.js --env production
          pm2 save
