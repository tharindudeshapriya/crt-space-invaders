name: Deploy Next.js App to EC2 via PM2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Next.js Production App
        run: |
          npm run build

      - name: Start or Reload PM2 Process
        run: |
          npx pm2 startOrReload ecosystem.config.js --env production
          npx pm2 save
