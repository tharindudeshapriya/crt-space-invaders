name: Production Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Sync Code Artifacts to Production Directory
        run: |
          # ⚠️ In production, ensure sync excludes dynamic user uploads or persistent runtime directories
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='actions-runner' \
            ./ /var/www/app/

      - name: Reload Application Cluster (Zero-Downtime)
        run: |
          cd /var/www/app
          # Gracefully reload processes without dropping connection pool
          pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
          pm2 save